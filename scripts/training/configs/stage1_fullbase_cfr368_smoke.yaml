output_dir: /mnt/beegfs/xiangbo/helios_runs/stage1_fullbase_cfr368_smoke
logging_dir: logs
seed: 44


report_to:
  tracker_name: Helios-Train
  wandb_name: stage1_fullbase_cfr368_smoke
  report_to: wandb


data_config:
  # ---- Base ----
  use_shuffle: true
  pin_memory: true
  persistent_workers: true
  force_rebuild: true
  single_res: true
  single_height: 368          # 368x640 (locked by the LoRA-17000 start + its latents)
  single_width: 640
  dataloader_num_workers: 8
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  # ---- Stage 1 ----
  use_stage1_dataset: true
  instance_data_root:
    # Same ~430k latents the LoRA-17000 run was trained on.
    - "/mnt/beegfs/dataset/video_single_24FPS/latents_cfr_int_30b_368x640"


model_config:
  # ---- Path ----
  pretrained_model_name_or_path: "/mnt/beegfs/yuheng/Helios/BestWishYSH/Helios-Distilled"
  # Consolidated START = LoRA-17000 selectively merged (base-linear + memory baked in; patch_embedding
  # left at base init, its LoRA carried separately). Produced by tools/merge_lora_partial_for_helios.py.
  transformer_model_name_or_path: "/mnt/beegfs/xiangbo/helios_runs/_merged/stage1_lora368_merged17000"
  subfolder: "transformer"
  load_checkpoints_custom: false
  load_dcp: false
  # ---- Vae ----
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  # ---- HYBRID FULL FINE-TUNE: full base-linear + LoRA patch_embedding + frozen norm ----
  # full_finetune_scope="base_linear_lora_patch": full-train the linear backbone + memory patches, keep
  # patch_embedding on a LoRA r128 adapter (seeded from the LoRA-17000 patch_embedding), freeze norm/AdaLN.
  is_full_finetune: true
  full_finetune_scope: "base_linear_lora_patch"
  patch_embedding_lora_init_path: "/mnt/beegfs/xiangbo/helios_runs/_merged/stage1_lora368_merged17000/patch_embedding_lora.safetensors"
  lora_rank: 128
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_layers: null
  lora_target_modules: []
  lora_exclude_modules:
    - down
    - up
  # ---- Other ----
  train_norm_layers: false


validation_config:
  # Built-in validation DISABLED (external eval handles inference). Keep a prompt so config validates.
  validation_steps: 100000000
  validation_height: 368
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A stylish woman walks down a Tokyo street filled with warm glowing neon and animated city signage."
  validation_guidance_scale: 5.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  # ---- Dynamic Shifting ----
  use_dynamic_shifting: true
  time_shift_type: "exponential"
  first_step_valid: false


training_config:
  # ---- Environment ----
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  # ---- Training Resource ----
  # ~14B base-linear full-FT via DeepSpeed ZeRO-2 on 16 GPU (2 nodes x 8). full base needs bs1.
  # GLOBAL BATCH 128 = 16 GPU x bs1 x accum8. ~430k latents -> 1 epoch ~= 3356 steps; 6000 ~= 1.8 epoch
  # (matches Round-2). skip_dataloader_dcp keeps resume world-size agnostic + dodges the multi-node
  # dcp.save NCCL crash.
  max_train_steps: 20
  train_batch_size: 1
  gradient_accumulation_steps: 1
  checkpointing_steps: 4
  checkpoints_total_limit: 8
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false
  skip_dataloader_dcp: true
  scale_lr: false
  # ---- Optimizer ----
  # NOTE: under DeepSpeed the LR is driven by WarmupLR in scripts/accelerate_configs/zero2_sched_1e6.json
  # (warmup_max_lr hardcoded to 1e-6 there; "auto" does NOT pick up the client-optimizer lr). Keep in sync.
  learning_rate: 1e-6
  lr_scheduler: "constant_with_warmup"
  lr_warmup_steps: 500
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # ---- Dynamic Shifting Parameters ----
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  # ---- VAE Decode Parameters ----
  vae_decode_type: "default"
  # ---- EMA Parameters ----
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 2
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  # ---- Stage 1 Parameters ----
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9
  is_random_drop: true
  random_drop_v2v_ratio: 0.4
  random_drop_t2v_ratio: 0.4
  #
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.9
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "noise"
  corrupt_mode_prob_history: 0.9
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  #
  is_amplify_history: false
  history_scale_mode: "per_head"
  #
  is_train_full_patch_embedding: false   # patch_embedding handled as LoRA by full_finetune_scope
  is_train_lora_patch_embedding: false   # (scope attaches its own patch_embedding adapter internally)
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: true
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
