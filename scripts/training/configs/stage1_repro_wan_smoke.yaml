output_dir: /mnt/beegfs/xiangbo/helios_runs/stage1_repro_wan_smoke
logging_dir: logs
seed: 44


report_to:
  tracker_name: Helios-Train
  wandb_name: stage1_repro_wan_smoke
  report_to: wandb


data_config:
  # ---- Base ----
  use_shuffle: true
  pin_memory: true
  persistent_workers: true
  force_rebuild: true
  single_res: true
  single_height: 384
  single_width: 640
  dataloader_num_workers: 8
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  # ---- Stage 1 ----
  use_stage1_dataset: true
  instance_data_root:
    # Same cfr_int + captions_30b_32f latents as the other runs (163,385 clips, 384x640).
    - "/mnt/beegfs/xiangbo/helios_runs/_smoke_latents"


model_config:
  # ---- Path ----
  # Non-transformer components (vae / text_encoder / tokenizer) from the LOCAL Helios-Base snapshot.
  pretrained_model_name_or_path: "/mnt/beegfs/xiangbo/.cache/huggingface/hub/models--BestWishYsh--Helios-Base/snapshots/21cf91da9cae0270a9405000c2e798f83770b1dd"
  # REPRODUCE STAGE 1: start the transformer from the RAW Wan2.1-T2V-14B-Diffusers base (not Helios-Base).
  # The Helios-only modules (patch_short/mid/long, multi_term_memory_patch, patch_embedding) init randomly
  # and train from scratch on top of the frozen Wan weights.
  transformer_model_name_or_path: "/mnt/beegfs/xiangbo/wan_diffusers/Wan2.1-T2V-14B-Diffusers"
  subfolder: "transformer"
  load_checkpoints_custom: false
  load_dcp: false
  # ---- Vae ----
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  # ---- LoRA r128 (faithful to stage_1_init.yaml) ----
  lora_rank: 128
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_layers: "all-linear"
  lora_exclude_modules:
    - down
    - up
  # ---- Other ----
  train_norm_layers: false


validation_config:
  # Built-in validation DISABLED (external eval on c-node08 handles inference). Keep a prompt so config validates.
  validation_steps: 100000000
  validation_height: 384
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A stylish woman walks down a Tokyo street filled with warm glowing neon and animated city signage."
  validation_guidance_scale: 5.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  # ---- Dynamic Shifting ----
  use_dynamic_shifting: true
  time_shift_type: "exponential"
  first_step_valid: false


training_config:
  # ---- Environment ----
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  # ---- Training Resource ----
  # 3 nodes (c-node05,06,07) x 8 GPU x bs2 x accum1 = GLOBAL BATCH 48. 163,385 clips -> 1 epoch ~= 3404 steps;
  # max_train_steps=6800 ~= 2 epochs. DCP checkpoints world-size locked to 24 -> resume on the same 24-GPU set.
  max_train_steps: 40
  train_batch_size: 1           # per-GPU; x24 GPU x accum1 = global batch 48
  gradient_accumulation_steps: 1
  checkpointing_steps: 10
  checkpoints_total_limit: 30
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false
  skip_dataloader_dcp: true   # dcp.save gather_object crashes NCCL on multi-node; resume w/o exact dataloader pos
  scale_lr: false
  # ---- Optimizer (faithful to stage_1_init.yaml: lr 5e-5) ----
  learning_rate: 5e-5
  lr_scheduler: "constant_with_warmup"   # linear warmup 0->5e-5 over lr_warmup_steps, then constant
  lr_warmup_steps: 4
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # ---- Dynamic Shifting Parameters ----
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  # ---- VAE Decode Parameters ----
  vae_decode_type: "default"
  # ---- EMA Parameters ----
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  # ---- Stage 1 Parameters ----
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9
  is_random_drop: true
  random_drop_v2v_ratio: 0.4
  random_drop_t2v_ratio: 0.4
  #
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.9
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "noise"
  corrupt_mode_prob_history: 0.9
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  #
  is_amplify_history: false
  history_scale_mode: "per_head"
  #
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: true
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: true
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
