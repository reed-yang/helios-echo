output_dir: /mnt/beegfs/xiangbo/helios_runs/stage1_fullft_cfr_dbg
logging_dir: logs
seed: 44


report_to:
  tracker_name: Helios-Train
  wandb_name: stage1_fullft_cfr_dbg
  report_to: wandb


data_config:
  # ---- Base ----
  use_shuffle: true
  pin_memory: true
  persistent_workers: true
  force_rebuild: true
  single_res: true
  single_height: 384
  single_width: 640
  dataloader_num_workers: 8
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  # ---- Stage 1 ----
  use_stage1_dataset: true
  instance_data_root:
    # Fresh cfr_int + captions_30b_32f encode (.pt with vae_latent + prompt_embed[_short]).
    # Single prompt per clip (no caption-version mixing).
    - "/mnt/beegfs/dataset/video_single_24FPS/latents_cfr_int_30b_384x640"


model_config:
  # ---- Path ----
  # tokenizer/vae/text_encoder load from this via subfolders. PLAIN LOCAL DIR (not an HF repo id)
  # to avoid the 32-rank HF-cache snapshot race.
  pretrained_model_name_or_path: "/mnt/beegfs/yuheng/Helios/BestWishYSH/Helios-Distilled"
  # Local Helios-Base snapshot dir (continue full fine-tune from Base/transformer_init).
  transformer_model_name_or_path: "/mnt/beegfs/xiangbo/.cache/huggingface/hub/models--BestWishYsh--Helios-Base/snapshots/21cf91da9cae0270a9405000c2e798f83770b1dd"
  subfolder: "transformer_init"
  load_checkpoints_custom: false
  load_dcp: false
  # ---- Vae ----
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  # ---- FULL FINE-TUNE (no LoRA) ----
  # is_full_finetune=true unfreezes the entire 14B transformer and SKIPS add_adapter. The LoRA
  # fields below are inert (lora_layers must be null so the LoRA target computation is skipped).
  is_full_finetune: true
  lora_rank: 128
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_layers: null
  lora_target_modules: []
  lora_exclude_modules:
    - down
    - up
  # ---- Other ----
  train_norm_layers: false


validation_config:
  # Built-in validation DISABLED (external eval handles inference). Keep a prompt so config validates.
  validation_steps: 100000000
  validation_height: 384
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A stylish woman walks down a Tokyo street filled with warm glowing neon and animated city signage."
  validation_guidance_scale: 5.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  # ---- Dynamic Shifting ----
  use_dynamic_shifting: true
  time_shift_type: "exponential"
  # External eval handles inference; skip the built-in step-1 validation (also avoids re-validating
  # on every crash-resume, and a slow ~50-step generate at each (re)start).
  first_step_valid: false


training_config:
  # ---- Environment ----
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  # ---- Training Resource ----
  # FULL fine-tune on the cfr_int / captions_30b_32f corpus (~154k encoded clips).
  # GLOBAL BATCH 32 = 4 nodes x 8 GPU x bs1 x accum1. 1 epoch ~= 154000/32 ~= 4800 steps.
  # CAPPED to 4500 (< 1 epoch) ON PURPOSE: DeepSpeed ZeRO-2 + the StatefulDataLoader deadlocks at the
  # FIRST checkpoint AFTER the epoch-1->2 rollover (validated: all mid-epoch-1 checkpoints + resume work
  # fine; the hang is rollover-specific). Staying inside epoch 1 keeps the run in the validated-reliable
  # region. Extend toward 2 epochs once the epoch-rollover hang is fixed. Checkpoints world-size locked
  # to 32 -> resume on 32 GPU.
  max_train_steps: 30
  train_batch_size: 1           # per-GPU; x32 GPU x accum1 = global batch 32
  gradient_accumulation_steps: 1
  checkpointing_steps: 10
  checkpoints_total_limit: 5
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false   # -> accelerator.save_state (DeepSpeed engine model+optim)
  skip_dataloader_dcp: true   # dcp.save gather_object crashes NCCL on multi-node; resume w/o exact dataloader pos
  scale_lr: false
  # ---- Optimizer ----
  # NOTE: under DeepSpeed the LR is driven by the WarmupLR scheduler in
  # scripts/accelerate_configs/zero2_sched.json (warmup_max_lr is hardcoded to 1e-5 there because
  # its "auto" does not pick up a client-optimizer lr). Keep that value in sync with learning_rate.
  learning_rate: 1e-5            # full-FT continue rate (well below the LoRA 3e-5)
  lr_scheduler: "constant"
  lr_warmup_steps: 200
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # ---- Dynamic Shifting Parameters ----
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  # ---- VAE Decode Parameters ----
  vae_decode_type: "default"
  # ---- EMA Parameters ----
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  # ---- Stage 1 Parameters ----
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9
  is_random_drop: true
  random_drop_v2v_ratio: 0.4
  random_drop_t2v_ratio: 0.4
  #
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.9
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "noise"
  corrupt_mode_prob_history: 0.9
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  #
  is_amplify_history: false
  history_scale_mode: "per_head"
  history_projection: none
  history_projection_step: 0.0
  history_projection_alpha: 1.0
  history_projection_codebook: null
  #
  # Full FT trains every module already; the LoRA-specific patch flags are inert (lora_layers=null).
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: false
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: false
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
