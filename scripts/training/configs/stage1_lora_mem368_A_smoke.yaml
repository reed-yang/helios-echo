# Stage A MICRO-TRAIN SMOKE — pre-training gate ② (not the real run).
# Derived from stage1_lora_mem368_A.yaml; differences ONLY:
#   - transformer = plain Helios-Base transformer_init (does NOT wait for the
#     merged ancestor base: the smoke tests trainer MECHANICS, not quality)
#   - 3 optimizer steps, bs1, accum2, 2 workers, force_rebuild off
#   - checkpointing_steps 2: exercises the save hooks ONCE (lora + partial
#     incl. the memory section-5 persistence) inside the smoke
#   - memory_single_write_prob 1.0: the write path must execute every step
# Launch (single GPU, WANDB_MODE=offline):
#   srun -p gpu --gres=gpu:h200:1 --time=01:00:00 bash -c \
#     "cd /mnt/beegfs/siyuan/workspace/helios-echo && WANDB_MODE=offline PYTHONPATH=. \
#      /mnt/beegfs/yuheng/miniconda3/envs/helios/bin/accelerate launch --num_processes 1 \
#      --mixed_precision bf16 train_helios.py --config scripts/training/configs/stage1_lora_mem368_A_smoke.yaml"
output_dir: /mnt/beegfs/siyuan/helios_runs/smoke_stage_a
logging_dir: logs
seed: 44


report_to:
  tracker_name: Helios-Train
  wandb_name: smoke_stage_a
  report_to: wandb


data_config:
  # ---- Base ----
  use_shuffle: true
  pin_memory: true
  persistent_workers: true
  force_rebuild: false          # v2 metadata cache is config-independent; the old
                                # single_res+force_rebuild invariant now applies only
                                # to non-stage1 datasets
  single_res: true
  single_height: 368
  single_width: 640
  dataloader_num_workers: 2     # smoke: light workers
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  # ---- Stage 1 ----
  use_stage1_dataset: true
  instance_data_root:
    # 40GB head-slice subset restored from the R2 backup (see main YAML note).
    - "/mnt/beegfs/siyuan/dataset/human_single_368x640_subset/latents"


model_config:
  # ---- Path ----
  pretrained_model_name_or_path: "/mnt/beegfs/yuheng/Helios/BestWishYSH/Helios-Distilled"
  transformer_model_name_or_path: "/mnt/beegfs/xiangbo/.cache/huggingface/hub/models--BestWishYsh--Helios-Base/snapshots/21cf91da9cae0270a9405000c2e798f83770b1dd"
  subfolder: "transformer_init"
  load_checkpoints_custom: false
  load_dcp: false
  # ---- Vae ----
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  # ---- LoRA r128 (matches the Stage A config; frozen by memory_freeze_backbone) ----
  lora_rank: 128
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_layers: "all-linear"
  lora_exclude_modules:
    - down
    - up
  # ---- Other ----
  train_norm_layers: false


validation_config:
  validation_steps: 100000000
  validation_height: 368
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A stylish woman walks down a Tokyo street filled with warm glowing neon and animated city signage."
  validation_guidance_scale: 5.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  use_dynamic_shifting: true
  time_shift_type: "exponential"
  first_step_valid: false


training_config:
  # ---- Environment ----
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  # ---- Training Resource (SMOKE) ----
  max_train_steps: 3
  train_batch_size: 1
  gradient_accumulation_steps: 2
  checkpointing_steps: 2
  checkpoints_total_limit: 1
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false
  skip_dataloader_dcp: true
  scale_lr: false
  # ---- Optimizer ----
  learning_rate: 1e-5
  lr_scheduler: "constant_with_warmup"
  lr_warmup_steps: 500
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # ---- Dynamic Shifting Parameters ----
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  # ---- VAE Decode Parameters ----
  vae_decode_type: "default"
  # ---- EMA Parameters ----
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  # ---- Stage 1 Parameters ----
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9
  is_random_drop: true
  random_drop_i2v_ratio: 0.1
  random_drop_v2v_ratio: 0.4
  random_drop_t2v_ratio: 0.4
  #
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.9
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "random"
  corrupt_mode_prob_history: 0.8889
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  is_add_saturation: true
  saturation_ratio_clean_prob: 0.1
  saturation_ratio_min: 0.3
  saturation_ratio_max: 1.7
  #
  is_amplify_history: false
  history_scale_mode: "per_head"
  #
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: true
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: true
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
  # ---- Evolving Memory (SMOKE: write every step) ----
  is_enable_evolving_memory: true
  memory_num_query_frames: 3
  memory_frame_hw: [12, 20]
  memory_enc_num_layers: 2
  memory_gate_init_bias: 0.75
  is_amplify_memory: true
  is_train_memory_module: true
  memory_freeze_backbone: true
  memory_learning_rate: 5.0e-5
  memory_bptt_sections: 1
  memory_write_source: "t0_hidden"
  memory_single_write_prob: 1.0
  memory_tf_unroll: false
  memory_unroll_sections: 1
