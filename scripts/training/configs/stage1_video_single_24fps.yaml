output_dir: /mnt/beegfs/xiangbo/helios_runs/stage1_video_single_24fps
logging_dir: logs
seed: 44


report_to:
  tracker_name: Helios-Train
  wandb_name: stage1_video_single_24fps
  report_to: wandb


data_config:
  # ---- Base ----
  use_shuffle: true
  pin_memory: true
  persistent_workers: true
  force_rebuild: true
  single_res: true
  single_height: 384
  single_width: 640
  dataloader_num_workers: 8
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  # ---- Stage 1 ----
  use_stage1_dataset: true
  instance_data_root:
    # Full video_single_24FPS encode (~1.2M .pt, each with prompt_embed_short + prompt_embed_long;
    # the dataloader mixes the two versions per sample automatically).
    - "/mnt/beegfs/dataset/video_single_24FPS/latents_short_384x640"


model_config:
  # ---- Path ----
  # tokenizer/vae/text_encoder load from this via subfolders. Use the PLAIN LOCAL DIR (not an
  # HF repo id) to avoid the 32-rank HF-cache snapshot race (OSError missing text_encoder shard).
  pretrained_model_name_or_path: "/mnt/beegfs/yuheng/Helios/BestWishYSH/Helios-Distilled"
  # Local Helios-Base snapshot dir (not the repo id): a repo id triggers HF-Hub snapshot
  # resolution that races across ranks on beegfs -> spurious missing-shard OSError.
  transformer_model_name_or_path: "/mnt/beegfs/xiangbo/.cache/huggingface/hub/models--BestWishYsh--Helios-Base/snapshots/21cf91da9cae0270a9405000c2e798f83770b1dd"
  subfolder: "transformer_init"
  load_checkpoints_custom: false
  # load_model_path:
  load_dcp: false
  # load_dcp_path:
  # ---- Vae ----
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  # ---- Lora ----
  lora_rank: 128
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_layers: "all-linear"
  # lora_target_modules:
  #   - to_k
  #   - to_q
  #   - to_v
  #   - to_out.0
  #   - ffn.net.0.proj
  #   - ffn.net.2
  lora_exclude_modules:
    - down
    - up
  # ---- Other ----
  train_norm_layers: false


validation_config:
  # Built-in validation DISABLED: the external 8-GPU eval node handles inference eval.
  # (Set absurdly high so it never fires; keep a prompt present so config stays valid.)
  validation_steps: 100000000
  validation_height: 384
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A stylish woman walks down a Tokyo street filled with warm glowing neon and animated city signage. She wears a black leather jacket, a long red dress, and black boots, and carries a black purse. She wears sunglasses and red lipstick. She walks confidently and casually. The street is damp and reflective, creating a mirror effect of the colorful lights. Many pedestrians walk about."
  validation_guidance_scale: 5.0
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  # ---- Dynamic Shifting ----
  use_dynamic_shifting: true
  time_shift_type: "exponential"  # ["exponential", "linear"]


training_config:
  # ---- Environment ----
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  # ---- Training Resource ----
  # FULL video_single_24FPS run: ~1 epoch. NOTE the dataloader drops clips with num_frames<121
  # (dataloader_mp4_dist.py:277) -> only 526,784 of the 1,200,989 train clips qualify (median
  # length is 113f). At 32 GPU x bs2 = global batch 64, one epoch ~= 526,784 / 64 ~= 8,231 steps
  # -> 8400. Checkpoint every 500 steps (~16 ckpts) so the live-eval node (c-node08) has frequent
  # checkpoints; keep all via a high total_limit. VERIFY on launch against "num_update_steps_per_epoch".
  # Launching on 3 nodes = 24 GPU x bs2 = global batch 48 (c-node07 drained, only 3 nodes free).
  # 1 epoch over 474,024 latents ~= 474024/48 ~= 9875 steps -> 9900. (DCP checkpoints are
  # world-size-locked, so if more nodes free up later, resume stays at 24 GPU.)
  max_train_steps: 9900
  train_batch_size: 2          # per-GPU; x24 GPU x accum1 = global batch 48
  gradient_accumulation_steps: 1
  checkpointing_steps: 500
  checkpoints_total_limit: 30
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false
  # ---- Optimizer ----
  learning_rate: 3e-5
  lr_scheduler: "constant"
  lr_warmup_steps: 500
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"  # ["sigma_sqrt", "logit_normal", "mode", "cosmap", "none"]
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # ---- Dynamic Shifting Parameters ----
  use_dynamic_shifting: false
  time_shift_type: "exponential"  # ["exponential", "linear"]
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  # ---- VAE Decode Parameters ----
  vae_decode_type: "default"
  # ---- EMA Parameters ----
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  # ---- Stage 1 Parameters ----
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  latent_window_size:
    - 9
  is_random_drop: true
  random_drop_v2v_ratio: 0.4
  random_drop_t2v_ratio: 0.4
  #
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.9
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "noise"
  corrupt_mode_prob_history: 0.9
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  #
  is_amplify_history: false
  history_scale_mode: "per_head"
  history_projection: none
  history_projection_step: 0.0
  history_projection_alpha: 1.0
  history_projection_jitter: 0.0
  history_projection_codebook: null
  #
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: true
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: true
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
